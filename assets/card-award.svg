<svg xmlns="http://www.w3.org/2000/svg" width="420" height="92" viewBox="0 0 420 92">
<style>
  text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .t { fill: #EEF0F6; }
  .s { fill: #98A1B3; }
  .f { fill: #5E677A; }
  .b { font-weight: 700; }

</style>
<defs><linearGradient id="trophy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs>

<g>
  <animateTransform attributeName="transform" type="translate" values="0 -60;0 -60;0 0" keyTimes="0;0.4;1" dur="1.2s" fill="freeze"/>
