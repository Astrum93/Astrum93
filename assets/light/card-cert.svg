<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
<style>
  text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .t { fill: #1F2328; }
  .s { fill: #59636E; }
  .f { fill: #8C959F; }
  .b { font-weight: 700; }

</style>
<defs><linearGradient id="medal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#6D5BD0"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="medalClip"><circle cx="58" cy="60" r="34"/></clipPath></defs>
<rect x="1" y="1" width="418" height="118" rx="22" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<circle cx="58" cy="60" r="34" fill="url(#medal)"/>
<circle cx="58" cy="60" r="26" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 3"/>
<text x="58" y="69" font-size="26" text-anchor="middle">🎖️</text>
<g clip-path="url(#medalClip)">
  <rect x="-40" y="20" width="30" height="80" fill="url(#shine)" transform="rotate(20 58 60)">
    <animate attributeName="x" values="-40;-40;140" keyTimes="0;0.6;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
<text x="108" y="40" font-size="12" fill="#2563EB" font-weight="700">국가기술자격 · 합격</text>
<text x="108" y="66" font-size="21" class="t b">정보처리기사</text>
<text x="400" y="40" font-size="12" text-anchor="end" class="f">2025.09</text>
<rect x="108" y="78" width="104" height="22" rx="11" fill="#B45309" fill-opacity="0.18"/>
<text x="160" y="93" font-size="12" text-anchor="middle" fill="#B45309" font-weight="700">비전공 개발자</text>
<text x="220" y="93" font-size="12" class="s">로 취득했어요</text>

</svg>
