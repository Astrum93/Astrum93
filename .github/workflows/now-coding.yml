name: Update NOW CODING

# 매일 한국 시간 자정(00:00 KST = 15:00 UTC)에 최근 작업한 공개 레포로 배너 문구를 갱신한다.
# 문구가 바뀌었을 때만 커밋한다.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find most recently pushed repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_now_coding.py

      - name: Regenerate SVGs
        run: |
          python3 scripts/gen_profile_svgs.py assets scripts/src/avatar.png scripts/src dark
          python3 scripts/gen_profile_svgs.py assets/light scripts/src/avatar.png scripts/src light
          python3 scripts/build_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/src/now_coding.txt assets README.md
          git commit -m "[auto] NOW CODING: $(cat scripts/src/now_coding.txt)"
          git push
