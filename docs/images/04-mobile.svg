<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><style>text{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1F2328} .s{fill:#59636E} .b{font-weight:700} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636E"/></marker></defs><rect x="1" y="1" width="758" height="328" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="24" y="36" font-size="16" class="b" text-anchor="start" >④ 모바일 — 모든 줄을 464px 통이미지로 (GitHub는 이미지마다 따로 줄인다)</text><text x="60" y="72" font-size="13.5" class="b" text-anchor="start" >가로 조각 (이전)</text><rect x="60" y="88" width="230" height="40" fill="#1B1F27"/><rect x="68" y="88" width="214" height="40" fill="#0F1218"/><text x="175" y="113" font-size="11" class="s" text-anchor="middle" style="fill:#98A1B3">통이미지 → 줄어듦</text><rect x="60" y="128" width="140" height="40" fill="#1E2330" stroke="#CF222E"/><text x="130" y="153" font-size="11" text-anchor="middle" style="fill:#EEF0F6">앱 정보</text><rect x="200" y="128" width="90" height="40" fill="#1E2330" stroke="#CF222E"/><text x="245" y="153" font-size="11" text-anchor="middle" style="fill:#EEF0F6">App Store</text><rect x="60" y="168" width="96" height="40" fill="#1E2330" stroke="#CF222E"/><text x="108" y="193" font-size="11" text-anchor="middle" style="fill:#EEF0F6">Google Play</text><text x="60" y="236" font-size="12.5" class="b" text-anchor="start" style="fill:#CF222E">✕ 조각은 원래 크기로 남아 줄이 넘어가고 깨짐</text><text x="420" y="72" font-size="13.5" class="b" text-anchor="start" >통이미지 (현재)</text><rect x="420" y="88" width="230" height="34" fill="#1B1F27"/><rect x="428" y="88" width="214" height="34" fill="#0F1218"/><rect x="438" y="94" width="194" height="22" rx="6" fill="#1E2330"/><rect x="420" y="122" width="230" height="34" fill="#1B1F27"/><rect x="428" y="122" width="214" height="34" fill="#0F1218"/><rect x="438" y="128" width="194" height="22" rx="6" fill="#1E2330"/><rect x="420" y="156" width="230" height="34" fill="#1B1F27"/><rect x="428" y="156" width="214" height="34" fill="#0F1218"/><rect x="438" y="162" width="194" height="22" rx="6" fill="#1E2330"/><rect x="420" y="190" width="230" height="34" fill="#1B1F27"/><rect x="428" y="190" width="214" height="34" fill="#0F1218"/><rect x="438" y="196" width="194" height="22" rx="6" fill="#1E2330"/><text x="420" y="236" font-size="12.5" class="b" text-anchor="start" style="fill:#1A7F37">✓ 모든 줄이 같은 비율로 줄어 폰 모양 유지</text><text x="24" y="290" font-size="12" class="s" text-anchor="start" >스토어 버튼처럼 링크가 여러 개 필요하면 '한 줄 = 링크 하나'로 나눈다. 아이콘은 두 줄에 반씩 그려 하나로 보이게 한다.</text></svg>
