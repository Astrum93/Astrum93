<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><style>text{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1F2328} .s{fill:#59636E} .b{font-weight:700} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636E"/></marker></defs><rect x="1" y="1" width="758" height="298" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="24" y="36" font-size="16" class="b" text-anchor="start" >⑤ GitHub 앱 대비 — 애니메이션이 없어도 기본값이 완성된 화면</text><text x="40" y="74" font-size="13.5" class="b" text-anchor="start" style="fill:#CF222E">이전: 겹쳐 그려짐</text><rect x="40" y="88" width="320" height="40" rx="10" fill="#0F1218"/><text x="56" y="113" font-size="13" style="fill:#EEF0F6;fill-opacity:0.55">Flutter로 구조가 탄탄한 앱을 만들어요</text><text x="56" y="113" font-size="13" style="fill:#EEF0F6;fill-opacity:0.55">GetX · Bloc · Riverpod 다 써봤어요</text><text x="56" y="113" font-size="13" style="fill:#EEF0F6;fill-opacity:0.55">Clean Architecture를 좋아합니다</text><text x="56" y="113" font-size="13" style="fill:#EEF0F6;fill-opacity:0.55">Music is Life 🎧</text><text x="400" y="74" font-size="13.5" class="b" text-anchor="start" style="fill:#1A7F37">현재: 첫 문구만 보임</text><rect x="400" y="88" width="320" height="40" rx="10" fill="#0F1218"/><text x="416" y="113" font-size="13" style="fill:#EEF0F6;fill-opacity:1">Flutter로 구조가 탄탄한 앱을 만들어요</text><rect x="24" y="156" width="712" height="118" rx="12" fill="#fff" stroke="#D0D7DE"/><text x="44" y="184" font-size="12.5" class="s" text-anchor="start" >웹 브라우저: SMIL 애니메이션 재생 → 문구가 차례로 타이핑됨</text><text x="44" y="208" font-size="12.5" class="s" text-anchor="start" >GitHub 앱: 애니메이션 · 글자 클립 미지원 → SVG의 기본값만 그려짐</text><text x="44" y="236" font-size="12.5" class="b" text-anchor="start" >→ 기본값을 '완성된 상태'로: 타이핑은 첫 줄만, 스위치는 ON, 그래프는 다 그려짐, 그림자는 filter 대신 도형</text><text x="44" y="260" font-size="12.5" class="b" text-anchor="start" >→ 외부 이미지를 못 불러오므로 프로필 사진·앱 아이콘은 base64로 SVG 안에 넣음</text></svg>
